; ZAPPING - réglages pensés pour un MacBook Air (Apple Silicon, sans ventilateur).
; Direction artistique : tout est émissif (écrans CRT), donc pas besoin de
; Lumen ni de Nanite. On garde le bloom pour la lueur des écrans.

[/Script/EngineSettings.GameMapsSettings]
EditorStartupMap=/Game/Zapping/Maps/L_Mur.L_Mur
GameDefaultMap=/Game/Zapping/Maps/L_Mur.L_Mur

[/Script/Engine.RendererSettings]
; Pas d'illumination globale dynamique (Lumen) ni de réflexions Lumen
r.DynamicGlobalIlluminationMethod=0
r.ReflectionMethod=2
; Ombres classiques plutôt que Virtual Shadow Maps
r.Shadow.Virtual.Enable=0
; Nanite inutile pour des boîtes de télé
r.Nanite.ProjectEnabled=False
; Couleurs maîtrisées : pas d'auto-exposition qui délave le rouge
r.DefaultFeature.AutoExposure=False
r.DefaultFeature.MotionBlur=False
r.DefaultFeature.Bloom=True
; Anti-aliasing TAA : moins coûteux que TSR
r.AntiAliasingMethod=2
