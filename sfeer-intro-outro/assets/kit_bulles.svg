l(#sfeerGrad)"/><path id="f8-trio_k1_point" d="M790 540a170 170 0 1 0 340 0a170 170 0 1 0 -340 0Z" fill="#FF6720" fill-rule="nonzero"/></svg><rect x="70" y="1795" width="600" height="337.5" fill="none" stroke="#240852" stroke-width="2"/><circle cx="100" cy="1825" r="20" fill="#FF6720"/><text x="100" y="1833" font-family="Inter, 'Loew Riyadh Air', Arial, sans-serif" font-size="22" font-weight="700" fill="#240852" text-anchor="middle">1</text><text x="70" y="2170.5" font-family="Inter, 'Loew Riyadh Air', Arial, sans-serif" font-size="24" font-weight="700" fill="#FF6720">k1 point</text><svg x="704" y="1795" width="600" height="337.5" viewBox="0 0 1920 1080" overflow="hidden"><defs></defs><rect id="f9-fond" width="1920" height="1080" fill="url(#sfeerGrad)"/><path id="f9-trio_k2_serre" d="M882.87 447.56A35.72 35.72 0 0 0 914.45 447.56A103.06 103.06 0 1 1 914.45 632.44A35.72 35.72 0 0 0 882.87 632.44A103.06 103.06 0 1 1 882.87 447.56Z M1005.55 447.56A35.72 35.72 0 0 0 1037.13 447.56A103.06 103.06 0 1 1 1037.13 632.44A35.72 35.72 0 0 0 1005.55 632.44A103.06 103.06 0 1 1 1005.55 447.56Z" fill="#FF6720" fill-rule="nonzero"/></svg><rect x="704" y="1795" width="600" height="337.5" fill="none" stroke="#240852" stroke-width="2"/><circle cx="734" cy="1825" r="20" fill="#FF6720"/><text x="734" y="1833" font-family="Inter, 'Loew Riyadh Air', Arial, sans-serif" font-size="22" font-weight="700" fill="#240852" text-anchor="middle">2</text><text x="704" y="2170.5" font-family="Inter, 'Loew Riyadh Air', Arial, sans-serif" font-size="24" font-weight="700" fill="#FF6720">k2 serre</text><svg x="1338" y="1795" width="600" height="337.5" viewBox="0 0 1920 1080" overflow="hidden"><defs></defs><rect id="f10-fond" width="1920" height="1080" fill="url(#sfeerGrad)"/><path id="f10-trio_k3_chaine" d="M794.29 499.67A41.81 41.81 0 0 0 870.52 499.67A98.15 98.15 0 1 1 870.52 580.33A41.81 41.81 0 0 0 794.29 580.33A98.15 98.15 0 1 1 794.29 499.67Z M1049.48 499.67A41.81 41.81 0 0 0 1125.71 499.67A98.15 98.15 0 1 1 1125.71 580.33A41.81 41.81 0 0 0 1049.48 580.33A98.15 98.15 0 1 1 1049.48 499.67Z" fill="#FF6720" fill-rule="nonzero"/></svg><rect x="1338" y="1795" width="600" height="337.5" fill="none" stroke="#240852" stroke-width="2"/><circle cx="1368" cy="1825" r="20" fill="#FF6720"/><text x="1368" y="1833" font-family="Inter, 'Loew Riyadh Air', Arial, sans-serif" font-size="22" font-weight="700" fill="#240852" text-anchor="middle">3</text><text x="1338" y="2170.5" font-family="Inter, 'Loew Riyadh Air', Arial, sans-serif" font-size="24" font-weight="700" fill="#FF6720">k3 chaine</text><text x="70" y="2442.5" font-family="Inter, 'Loew Riyadh Air', Arial, sans-serif" font-size="40" font-weight="700" fill="#240852">Logo · les deux points sont des bulles (gabarit)</text><line x1="70" y1="2464.5" x2="2572" y2="2464.5" stroke="#240852" stroke-width="2" opacity="0.25"/><svg x="70" y="2492.5" width="600" height="337.5" viewBox="0 0 1920 1080" overflow="hidden"><defs></defs><rect id="f11-fond" width="1920" height="1080" fill="url(#sfeerGrad)"/><g id="f11-logo" font-family="Inter, 'Loew Riyadh Air', Arial, sans-serif"><circle id="f11-logo-dot-g" cx="653.06" cy="540" r="11.97" fill="#FFFFFF"/><text x="710.08" y="576.61" font-size="140.8" font-weight="400" letter-spacing="22.53" fill="#FFFFFF" textLength="499.84" lengthAdjust="spacingAndGlyphs">sfeer</text><circle id="f11-logo-dot-d" cx="1266.94" cy="540" r="11.97" fill="#FFFFFF"/><text x="726.98" y="706.14" font-family="'Loew Riyadh Air Arabic', 'DejaVu Sans', sans-serif" font-size="121.09" fill="#FFFFFF" textLength="279.91" lengthAdjust="spacing">سفيـــــر</text></g></svg><rect x="70" y="2492.5" width="600" height="337.5" fill="none" stroke="#240852" stroke-width="2"/><circle cx="100" cy="2522.5" r="20" fill="#FF6720"/><text x="100" y="2530.5" font-family="Inter, 'Loew Riyadh Air', Arial, sans-serif" font-size="22" font-weight="700" fill="#240852" text-anchor="middle">1</text><text x="70" y="2868" font-family="Inter, 'Loew Riyadh Air', Arial, sans-serif" font-size="24" font-weight="700" fill="#FF6720">logo-dot-g / logo-dot-d</text><text x="70" y="2904" font-family="Inter, 'Loew Riyadh Air', Arial, sans-serif" font-size="23" fill="#240852">Gabarit : remplacer par le vectoriel</text><text x="70" y="2936" font-family="Inter, 'Loew Riyadh Air', Arial, sans-serif" font-size="23" fill="#240852">officiel, garder les points en calques</text><text x="70" y="2968" font-family="Inter, 'Loew Riyadh Air', Arial, sans-serif" font-size="23" fill="#240852">séparés.</text><text x="70" y="3140" font-family="Inter, 'Loew Riyadh Air', Arial, sans-serif" font-size="30" font-weight="700" fill="#FF6720">Règles de construction</text><text x="70" y="3186" font-family="Inter, 'Loew Riyadh Air', Arial, sans-serif" font-size="23" fill="#240852" xml:space="preserve">• Bulles toujours centrées sur l&#x27;axe horizontal (y = 540).</text><text x="70" y="3226" font-family="Inter, 'Loew Riyadh Air', Arial, sans-serif" font-size="23" fill="#240852" xml:space="preserve">• Aire conservée à la division : r = R/√2 (deux), R/√3 (trois).</text><text x="70" y="3266" font-family="Inter, 'Loew Riyadh Air', Arial, sans-serif" font-size="23" fill="#240852" xml:space="preserve">• Col = arcs de cercles tangents aux deux bulles ; épaisseur pilotée par un seul paramètre.</text><text x="1346" y="3140" font-family="Inter, 'Loew Riyadh Air', Arial, sans-serif" font-size="30" font-weight="700" fill="#FF6720">Usage motion</text><text x="1346" y="3186" font-family="Inter, 'Loew Riyadh Air', Arial, sans-serif" font-size="23" fill="#240852" xml:space="preserve">• Importer chaque pose en calques de forme et interpoler le tracé (même nombre de sommets).</text><text x="1346" y="3226" font-family="Inter, 'Loew Riyadh Air', Arial, sans-serif" font-size="23" fill="#240852" xml:space="preserve">• Alternative souple : deux cercles + effet &#x27;gooey&#x27; (flou + seuil), à éviter pour Lottie.</text><text x="70" y="3362.0" font-family="Inter, 'Loew Riyadh Air', Arial, sans-serif" font-size="20" fill="#240852" opacity="0.6">Storyboard marble.studio · gabarit logo, typo Inter en remplacement de Loew Riyadh Air · décors du film simplifiés en aplats</text></svg>